<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#19372b">
    <title>Ingresar al negocio | FUDO Plus</title>
    <link rel="stylesheet" href="/static/admin.css">
    <link rel="stylesheet" href="/static/login.css">
    <script src="/static/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand" href="/" aria-label="FUDO Plus, menú público"><span class="brand-mark">F<span>+</span></span> FUDO Plus</a>
      <p class="eyebrow">Panel del negocio</p>
      <h1>Qué bueno verte.</h1>
      <p class="muted">Ingresá para gestionar los productos que aparecen en tu menú.</p>
      <a class="google-button" href="/auth/google"><span aria-hidden="true">G</span> Continuar con Google</a>
      <p id="oauth-message" class="message error" role="alert" hidden></p>
      <div class="login-divider"><span>o ingresá con usuario y contraseña</span></div>
      <form id="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-message" class="message" role="alert" hidden></p>
        <button id="login-button" class="primary-button" type="submit">Ingresar</button>
      </form>
      <a class="back-link" href="/">← Volver al menú público</a>
    </main>
  </body>
</html>
